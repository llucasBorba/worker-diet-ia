
####################################
###############  H2  ###############
####################################

quarkus.datasource.jdbc.url=jdbc:h2:mem:default
quarkus.datasource.db-kind=h2
quarkus.hibernate-orm.database.generation=drop-and-create


#mp.messaging.incoming.diet-requests.connector=smallrye-in-memory
#mp.messaging.outgoing.diet-responses.connector=smallrye-in-memory


quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=phi3
quarkus.langchain4j.ollama.timeout=60s
quarkus.langchain4j.infinispan.dimension=384
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true


# IA de Vetores (Embedding) - Use o modelo que você baixou (ollama pull all-minilm)
quarkus.langchain4j.ollama.embedding-model.model-id=all-minilm

# Configuração da Store (Infinispan em memória é ótimo para 8GB RAM)
quarkus.infinispan.client.hosts=localhost:11222


